<!doctype html>
<!-- WP4-20: a picker with a locate button, embedded by the spec in a CROSS-origin iframe without allow="geolocation". -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Element locate button</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <location-picker
      id="where"
      value="48.8584,2.2945"
      zoom="15"
      locate="button"
      aria-label="Where is it?"
      style="height: 300px"
    ></location-picker>
    <script src="/dist/location-picker.global.js"></script>
  </body>
</html>
