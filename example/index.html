<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>location-picker example (ESM)</title>
    <link rel="stylesheet" href="../dist/location-picker.css" />
    <style>
      #map {
        width: 100%;
        height: 480px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <br />
    <button id="confirmPosition">Confirm Position</button>
    <p>On idle position: <span id="onIdlePositionView"></span></p>
    <p>On click position: <span id="onClickPositionView"></span></p>

    <!-- Google Maps JS API. Replace YOUR_API_KEY. -->
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=marker&callback=initApp"
    ></script>

    <script type="module">
      // Build first (`npm run build`) so ../dist/index.mjs exists.
      import { LocationPicker } from '../dist/index.mjs';

      window.initApp = function () {
        const lp = new LocationPicker(
          'map',
          {
            setCurrentPosition: true,
            lat: 45.5017,
            lng: -73.5673,
            onLocationChange: (pos) => {
              document.getElementById('onIdlePositionView').textContent =
                `The chosen location is ${pos.lat},${pos.lng}`;
            },
          },
          { zoom: 15 },
        );

        document.getElementById('confirmPosition').onclick = () => {
          const { lat, lng } = lp.getMarkerPosition();
          document.getElementById('onClickPositionView').textContent =
            `The chosen location is ${lat},${lng}`;
        };
      };
    </script>
  </body>
</html>
