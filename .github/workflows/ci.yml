name: CI

on:
  push:
    branches: [master, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit, build, package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # test/package/* pack dist/, and under CI=true they fail rather than skip without it (A13.4).
      - run: npm run build
      - run: npm test
      - name: Frozen v1 artifact matches its source
        run: node scripts/minify-v1.mjs --check
      - name: Package file set (CONTRACT §1.2)
        run: node scripts/pack-check.mjs
      - run: npm run publint
      - run: npm run attw
      - run: npm run size
      # Trimmed consumer types matrix (A13.4); the full one runs weekly in types-matrix.yml.
      - name: Types matrix, trimmed (TS 5.9.3 and 7.0.2 x bundler, nodenext-esm, nodenext-cjs)
        if: matrix.node == 24
        run: npm run types-matrix -- --concurrency 4

  docs:
    name: Doc snippets (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # CONTRACT §12.7 / WP5-11: every block of the README, llms.txt, SKILL.md and docs/*.md, by info string.
      # TODO(A13.7 ship gate): remove continue-on-error once WP4 lands src/global.ts, src/jsx/react.d.ts and
      # types/globals.d.ts and WP3 lands src/google.ts and e2e/fixtures/google-maps-mock.js; the ship gate needs
      # docs:test green with zero skips in README, llms.txt and SKILL.md. The tagging rules stay blocking in npm test.
      - name: Doc snippets (non-blocking until the A13.7 ship gate)
        id: docs
        continue-on-error: true
        run: npm run docs:test
      - uses: actions/upload-artifact@v7
        if: failure() || steps.docs.outcome == 'failure'
        with:
          name: docs-test-results
          path: test-results/
          retention-days: 7

  browser:
    name: Browser + e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - name: Browser project (Chromium, Firefox, WebKit)
        run: npm run test:browser
      # e2e/site.spec.ts and e2e/pick.spec.ts test the built site (WP6).
      - name: Build the site into _site
        run: node scripts/build-site.mjs
      - name: E2E, small matrix (3 engines x 375 touch / 1440 mouse)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-node${{ matrix.node }}
          path: |
            test-results/
            .vitest/attachments/
          retention-days: 7
