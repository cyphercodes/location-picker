version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Pinned on purpose: the routes serve node_modules/leaflet for the SRI-locked jsDelivr 1.9.4 URLs.
      - dependency-name: leaflet
      # The package supports Node >=22.22, so its types stay on the Node 22 line.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One pull request a month for every npm update. A single group also keeps the packages that pin each other
      # together (the Vitest Playwright provider requires the exact vitest; Playwright's browsers follow its version).
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
